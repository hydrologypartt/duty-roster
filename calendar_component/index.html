<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:Arial,"Noto Sans Thai",sans-serif;color:#222}
.wrap{width:100%;padding:2px 0 8px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{margin-bottom:6px}.wd div{text-align:center;font-weight:700;font-size:14px;padding:4px 0}
.day{border:1px solid #d9dce3;border-radius:10px;background:#fff;min-height:54px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:.08s;user-select:none}
.day:hover{border-color:#5b4bdb}.day.empty{visibility:hidden;cursor:default}
.day.weekend,.day.holiday{background:#fde2e2}
.day.selected{background:#5b4bdb;color:#fff;border-color:#5b4bdb;font-weight:700}
.summary{margin-top:10px;padding:12px 16px;border-radius:7px;background:#e8f1ff;color:#0969b0;font-size:14px}.actions{display:flex;gap:8px;margin-top:10px}
.save{border:0;border-radius:8px;background:#5b4bdb;color:white;font-weight:700;padding:10px 18px;cursor:pointer;width:100%;font-size:16px}
.save:active{transform:scale(.99)}
@media(max-width:640px){.wd,.grid{gap:3px}.day{min-height:43px;border-radius:7px;font-size:14px}.wd div{font-size:12px}.save{font-size:15px;padding:9px}.summary{font-size:13px;padding:10px 12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="wd" id="wd"></div>
  <div class="grid" id="grid"></div>
  <div class="summary" id="summary">เลือกแล้ว 0 วัน: ยังไม่ได้เลือก</div>
  <div class="actions"><button class="save" id="save" type="button">💾 บันทึกวันไม่ว่าง</button></div>
</div>
<script>
// Self-contained Streamlit component protocol.
// ไม่โหลด streamlit-component-lib จาก CDN จึงไม่ขึ้นอยู่กับอินเทอร์เน็ตของ browser
const ST = {
  ready(){ window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1}, '*'); },
  height(h){ window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.ceil(h)}, '*'); },
  value(v){ window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v,dataType:'json'}, '*'); }
};

let cfg = {year:new Date().getFullYear(), month:new Date().getMonth()+1, selected:[], holidays:{}};
let selected = new Set();
let hasRendered = false;

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const wd=['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
  document.getElementById('wd').innerHTML=wd.map(x=>`<div>${x}</div>`).join('');

  const y=Number(cfg.year), m=Number(cfg.month);
  const first=new Date(y,m-1,1).getDay();
  const offset=(first+6)%7;
  const days=new Date(y,m,0).getDate();
  const holidays=cfg.holidays||{};
  let html='';

  for(let i=0;i<offset;i++) html+='<div class="day empty" aria-hidden="true"></div>';
  for(let d=1;d<=days;d++){
    const dt=new Date(y,m-1,d);
    const iso=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=(dt.getDay()+6)%7;
    const isHoliday=Object.prototype.hasOwnProperty.call(holidays,iso);
    const red=dow>=5 || isHoliday;
    const sel=selected.has(iso);
    const title=isHoliday ? escapeHtml(holidays[iso]||'วันหยุดพิเศษ') : '';
    html+=`<button type="button" class="day ${red?'weekend':''} ${sel?'selected':''}" data-iso="${iso}" title="${title}">${d}</button>`;
  }
  document.getElementById('grid').innerHTML=html;
  const picked=Array.from(selected).sort();
  document.getElementById('summary').textContent = picked.length ? `เลือกแล้ว ${picked.length} วัน: ${picked.map(x=>Number(x.slice(-2))).join(', ')}` : 'เลือกแล้ว 0 วัน: ยังไม่ได้เลือก';

  document.querySelectorAll('.day[data-iso]').forEach(el=>{
    el.addEventListener('click',()=>{
      const iso=el.dataset.iso;
      if(selected.has(iso)) selected.delete(iso); else selected.add(iso);
      render();
    });
  });
  hasRendered = true;
  ST.height(document.body.scrollHeight + 4);
}

window.addEventListener('message', (event)=>{
  const data=event.data;
  if(!data || data.type !== 'streamlit:render') return;
  cfg=data.args || {};
  selected=new Set(Array.isArray(cfg.selected) ? cfg.selected : []);
  render();
});

document.getElementById('save').addEventListener('click',()=>{
  ST.value(Array.from(selected).sort());
});

// แจ้ง Streamlit ว่า component พร้อมใช้งาน แล้วรอ render event
ST.ready();
setTimeout(()=>ST.height(document.body.scrollHeight + 4), 0);
</script>
</body>
</html>
